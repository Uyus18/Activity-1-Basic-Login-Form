<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Welcome Back</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Animations -->
  <link rel="stylesheet" href="../animate/login.css" />
  <!-- Login CSS -->
  <link rel="stylesheet" href="../css/login/design.css" />
  <link rel="stylesheet" href="../css/login/texts.css" />
  <link rel="stylesheet" href="../css/login/inputs.css" />
  <link rel="stylesheet" href="../css/login/button.css" />
  <link rel="stylesheet" href="../css/login/responsive.css" />
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Welcome back</h1>
      <p class="subtitle">Enter your credentials to access your account</p>
    </div>

    <div class="success-banner" id="successBanner" style="display: none;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
      </svg>
      <span>Success! Redirecting to your dashboard...</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        />
        <span class="error-msg" id="emailError">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/>
          </svg>
          Please enter a valid email address
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
            <svg class="eye-icon eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-icon eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="error-msg" id="passwordError">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/>
          </svg>
          Password must be at least 6 characters
        </span>
      </div>

      <button type="submit" class="btn-primary">
        <span class="btn-text">Sign In</span>
        <svg class="btn-arrow" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"/>
        </svg>
      </button>
    </form>

    <div class="card-footer">
      <a href="#" id="forgotLink" class="link-primary">Forgot your password?</a>
      <p class="footer-text">
        Don't have an account? <a href="#" id="signupLink" class="link-primary">Create one now</a>
      </p>
    </div>
  </div>

  <script>
    // Password toggle
    const passwordToggle = document.getElementById('passwordToggle');
    const passwordField = document.getElementById('password');

    passwordToggle.addEventListener('click', function() {
      const isPassword = passwordField.type === 'password';
      passwordField.type = isPassword ? 'text' : 'password';
      this.classList.toggle('active');
    });

    // Form validation & submit
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');
      const successBanner = document.getElementById('successBanner');
      const submitBtn = e.target.querySelector('.btn-primary');

      let valid = true;

      // Reset errors
      email.classList.remove('error-field');
      password.classList.remove('error-field');
      successBanner.style.display = 'none';

      // Validate email
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email.value.trim())) {
        email.classList.add('error-field');
        valid = false;
      }

      // Validate password
      if (password.value.length < 6) {
        password.classList.add('error-field');
        valid = false;
      }

      if (valid) {
        submitBtn.classList.add('loading');
        
        setTimeout(() => {
          successBanner.style.display = 'flex';
          
          setTimeout(() => {
            window.location.href = './homepage.html';
          }, 800);
        }, 1000);
      }
    });

    // Forgot password
    document.getElementById('forgotLink').addEventListener('click', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (email) {
        alert(`Password reset instructions will be sent to: ${email}`);
      } else {
        alert('Please enter your email address first.');
      }
    });

    // Sign up
    document.getElementById('signupLink').addEventListener('click', function(e) {
      e.preventDefault();
      alert('Create account page would open here.');
    });
  </script>
</body>
</html>
